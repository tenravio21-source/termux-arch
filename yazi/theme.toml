[manager]
# Deep blue for the current directory path
cwd = { fg = "#4078f2" } 

# Hovered item: White text on a vibrant blue background
hovered = { fg = "#ffffff", bg = "#4078f2", bold = true }

# Selection / Preview
preview_hovered = { underline = true, bold = true }

[status]
# These look great with Nerd Fonts
separator_open  = ""
separator_close = ""

[status.mode]
# OneLight Palette: Blue (Normal), Green (Select), Purple (Unset)
normal = { bg = "#4078f2", fg = "#ffffff", bold = true }
select = { bg = "#50a14f", fg = "#ffffff", bold = true }
unset  = { bg = "#a626a4", fg = "#ffffff", bold = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#986801" }, # Ochre
    { mime = "video/*", fg = "#986801" },
    { mime = "audio/*", fg = "#986801" },
    { mime = "text/*",  fg = "#383a42" }, # Dark gray text for light bg
    { name = "*.zip",   fg = "#e45649" }, # Soft Red
    { name = "*.tar",   fg = "#e45649" },
    { name = "*.lock",  fg = "#a626a4" }, # Purple for lockfiles
]
