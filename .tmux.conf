# ==============================================================================
# TERMINAL & OPTIONS
# ==============================================================================

# Set default shell (Nushell)
set-option -g default-shell "/usr/sbin/nu"

# True color support and terminal overrides
set -as terminal-overrides ",xterm*:Tc,alacritty*:Tc,screen*:Tc,tmux*:Tc,vte*:Tc"
set -g default-terminal "screen-256color"

set -g escape-time 0           # Disable delays on escape sequences
set -g mouse on               # Enable mouse support
set -g renumber-windows on    # Keep numbering sequential
set -g repeat-time 1000       # Increase "prefix-free" repeat window

# Start indexes from 1 (more ergonomic for keyboards)
set -g base-index 1
set -g pane-base-index 1

# ==============================================================================
# PREFIX & KEYBINDINGS
# ==============================================================================

# Change prefix to backtick (`)
unbind C-b
set -g prefix `
bind ` send-prefix

# Navigation: WASD (with Prefix)
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

# Resizing: Shift + WASD (with Prefix, Repeatable)
bind -r W resize-pane -U
bind -r A resize-pane -L
bind -r S resize-pane -D
bind -r D resize-pane -R

# Navigation: Alt + WASD (No Prefix needed)
bind -n M-w select-pane -U
bind -n M-a select-pane -L
bind -n M-s select-pane -D
bind -n M-d select-pane -R

# Standard Arrow Keys (Disable repeat for precision)
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Window Management
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Splitting Panes
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v

# Utility
bind f resize-pane -Z         # Zoom pane
bind -n M-f resize-pane -Z    # Alt-F Zoom (No prefix)
bind q detach-client          # Detach session
bind e choose-window -Z       # Window picker

# ==============================================================================
# THEME & STATUS BAR
# ==============================================================================

# Borders
set -g pane-border-lines simple
set -g pane-border-style fg=#333333      # Dark Gray border
set -g pane-active-border-style fg=magenta

# Status Bar General
set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=#666666]#S"

# Window Status (The "Dots")
# Inactive window: Dim gray dot
set -g window-status-format "●"
setw -g window-status-style "fg=#444444,bg=default"

# Active window: Green dot (Yellow if zoomed)
setw -g window-status-current-style "none"
setw -g window-status-current-format "#{?window_zoomed_flag,#[fg=yellow],#[fg=green]} ● "

# Alert/Bell Status
set -g window-status-bell-style "fg=red,bright"

